{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-sub">Error {{ code }}</p>
  </div>
</div>
<div class="panel form-card">
  <div class="empty"><strong>{{ title }}</strong>{{ message }}</div>
  <div class="panel-foot">
    <a class="btn btn-primary btn-sm" href="{{ url_for('dashboard') }}">Go to the dashboard</a>
    <a class="btn btn-outline-secondary btn-sm" href="javascript:history.back()">Go back</a>
  </div>
</div>
{% endblock %}
