{% extends "base.html" %}
{% block title %}My profile{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">My profile</h1>
    <p class="page-sub">Signed in as {{ g.user['role'] }}.</p>
  </div>
</div>

<div class="split" style="margin-top:0">
  <form method="post" class="panel">
    <div class="panel-head">Your details</div>
    <div class="panel-body">
      <input type="hidden" name="action" value="details">
      <div class="mb-3">
        <label class="form-label" for="name">Full name</label>
        <input type="text" id="name" name="name" class="form-control" value="{{ g.user['name'] }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ g.user['email'] }}" required>
      </div>
      <button class="btn btn-primary">Save details</button>
    </div>
  </form>

  <form method="post" class="panel">
    <div class="panel-head">Change password</div>
    <div class="panel-body">
      <input type="hidden" name="action" value="password">
      <div class="mb-3">
        <label class="form-label" for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" class="form-control" autocomplete="current-password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" class="form-control" autocomplete="new-password" required>
        <div class="field-hint">At least 6 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary">Change password</button>
    </div>
  </form>
</div>
{% endblock %}
