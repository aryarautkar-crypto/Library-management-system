{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">{{ heading }}</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Title *</label>
            <input type="text" name="title" class="form-control" maxlength="200"
                   value="{{ book['title'] if book else '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Author *</label>
            <input type="text" name="author" class="form-control" maxlength="120"
                   value="{{ book['author'] if book else '' }}" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">ISBN</label>
              <input type="text" name="isbn" class="form-control" maxlength="20"
                     value="{{ (book['isbn'] or '') if book else '' }}">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              <input type="text" name="category" class="form-control" maxlength="60"
                     value="{{ (book['category'] or '') if book else '' }}">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Total Copies *</label>
            <input type="number" name="total_copies" class="form-control" min="1"
                   value="{{ book['total_copies'] if book else 1 }}" required>
          </div>
          <button class="btn btn-primary">Save</button>
          <a href="{{ url_for('books.list_books') }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
